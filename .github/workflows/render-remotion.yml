name: Render Remotion Experience
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'remotion/**'
      - '.github/workflows/render-remotion.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK SC' | head -1
        working-directory: .
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg
        working-directory: .
      - name: Generate test audio
        run: mkdir -p public && ffmpeg -hide_banner -loglevel error -y -f lavfi -i sine=frequency=440:duration=10:sample_rate=16000 -ac 1 public/audio-cue.wav
      - name: Generate Chinese narration and aligned subtitles
        run: |
          python3 -m pip install --user edge-tts==7.2.7
          python3 scripts/generate_narration.py
      - name: Render video
        run: |
          npm run render:ecosystem
          npm run render:graphics
          npm run render:captions
          npm run render:narration
      - name: Validate video
        run: |
          test -s out/ecosystem-transitions.mp4
          test -s out/ecosystem-graphics.mp4
          test -s out/ecosystem-captions.mp4
          test -s out/chinese-narration.mp4
          test -s public/narration.srt
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 out/chinese-narration.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 out/ecosystem-captions.mp4
          ffmpeg -hide_banner -i out/ecosystem-captions.mp4 -vn -af volumedetect -f null - 2>&1 | tee /tmp/remotion-audio-levels.txt
          grep -q 'max_volume:' /tmp/remotion-audio-levels.txt
          if grep -q 'max_volume: -91.0 dB' /tmp/remotion-audio-levels.txt; then exit 1; fi
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 out/ecosystem-transitions.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 out/ecosystem-graphics.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 out/ecosystem-captions.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: remotion-ecosystem-validation
          path: |
            remotion/out/ecosystem-transitions.mp4
            remotion/out/ecosystem-graphics.mp4
            remotion/out/ecosystem-captions.mp4
            remotion/out/chinese-narration.mp4
            remotion/public/narration.srt
          retention-days: 30
          if-no-files-found: error
      - name: Publish run locator
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_REF: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        working-directory: .
        run: |
          mkdir -p .video-status
          python3 - <<'PY'
          import json,os,datetime
          status={"run_id":int(os.environ["RUN_ID"]),"attempt":int(os.environ["RUN_ATTEMPT"]),"job_status":os.environ["JOB_RESULT"],"sha":os.environ["RUN_SHA"],"branch":os.environ["RUN_REF"],"run_url":f'https://github.com/{os.environ["REPOSITORY"]}/actions/runs/{os.environ["RUN_ID"]}',"updated_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"artifact_name":"remotion-ecosystem-validation","expected_files":["ecosystem-transitions.mp4","ecosystem-graphics.mp4","ecosystem-captions.mp4","chinese-narration.mp4","narration.srt"]}
          with open('.video-status/remotion-latest.json','w') as f: json.dump(status,f,ensure_ascii=False,indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .video-status/remotion-latest.json
          git commit -m "ci: record Remotion render run [skip ci]" || exit 0
          git push origin HEAD:main
