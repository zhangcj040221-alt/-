name: Render Remotion Experience
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'remotion/**'
      - '.github/workflows/render-remotion.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Render video
        run: |
          npm run render
          npm run render:mg
          npm run render:film
      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
        working-directory: .
      - name: Validate video
        run: |
          test -s out/remotion-intro.mp4
          test -s out/remotion-mg-showcase.mp4
          test -s out/thunder-explainer.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 out/remotion-intro.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 out/remotion-mg-showcase.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 out/thunder-explainer.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: remotion-intro-mp4
          path: |
            remotion/out/remotion-intro.mp4
            remotion/out/remotion-mg-showcase.mp4
            remotion/out/thunder-explainer.mp4
          retention-days: 30
          if-no-files-found: error
      - name: Publish run locator
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_REF: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        working-directory: .
        run: |
          mkdir -p .video-status
          python3 - <<'PY'
          import json,os,datetime
          status={"run_id":int(os.environ["RUN_ID"]),"attempt":int(os.environ["RUN_ATTEMPT"]),"job_status":os.environ["JOB_RESULT"],"sha":os.environ["RUN_SHA"],"branch":os.environ["RUN_REF"],"run_url":f'https://github.com/{os.environ["REPOSITORY"]}/actions/runs/{os.environ["RUN_ID"]}',"updated_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"artifact_name":"remotion-intro-mp4","expected_files":["remotion-intro.mp4","remotion-mg-showcase.mp4","thunder-explainer.mp4"]}
          with open('.video-status/remotion-latest.json','w') as f: json.dump(status,f,ensure_ascii=False,indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .video-status/remotion-latest.json
          git commit -m "ci: record Remotion render run [skip ci]" || exit 0
          git push origin HEAD:main
