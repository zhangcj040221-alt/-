name: Render Remotion Experience
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project JSON basename under remotion/projects (e.g. water-cycle)'
        required: true
        default: water-cycle
        type: string
      target:
        description: 'Video to render (one target or all for regression)'
        required: true
        type: choice
        default: project
        options:
          - project
          - water-cycle
          - thunder-music
          - ecosystem-transitions
          - ecosystem-graphics
          - ecosystem-captions
          - all
  push:
    branches: [main]
    paths:
      - 'remotion/**'
      - '.github/workflows/render-remotion.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RENDER_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'project' }}
      RENDER_PROJECT: ${{ github.event_name == 'workflow_dispatch' && inputs.project || 'water-cycle' }}
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore persistent CJK font cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts/noto-cjk
          key: cjk-noto-ubuntu-24.04-v1
      - name: Ensure Chinese fonts available
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/fonts/noto-cjk"
          if fc-list : family | grep -qi 'Noto Sans CJK'; then
            echo 'Noto CJK found; no download required'
          else
            echo 'Noto CJK missing; downloading once into reusable user font cache'
            mkdir -p "$RUNNER_TEMP/cjk-package"
            cd "$RUNNER_TEMP/cjk-package"
            timeout 180s apt-get download fonts-noto-cjk
            dpkg-deb -x fonts-noto-cjk_*.deb extracted
            find extracted/usr/share/fonts -type f -name '*.ttc' -exec cp -t "$HOME/.local/share/fonts/noto-cjk/" {} +
            fc-cache -f
          fi
          fc-list : family | grep -qi 'Noto Sans CJK' || { echo 'Noto CJK still missing' >&2; exit 1; }
          fc-match 'Noto Sans CJK SC' | head -1
        working-directory: .
      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('remotion/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Reuse Remotion bundled FFmpeg tools
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/remotion-bin"
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const candidates=[
            ['@remotion/compositor-linux-x64-gnu','ffmpeg'],
            ['@remotion/compositor-linux-x64-gnu','ffprobe']
          ];
          for(const [pkg,name] of candidates){
            try{
              const root=path.dirname(require.resolve(pkg+'/package.json'));
              const found=fs.readdirSync(root,{recursive:true}).find(x=>path.basename(x)===name);
              if(found){fs.copyFileSync(path.join(root,found),path.join(process.env.RUNNER_TEMP,'remotion-bin',name));continue;}
            }catch(e){console.log(pkg+': '+e.message)}
          }
          NODE
          for tool in ffmpeg ffprobe; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool available on PATH"
            elif test -s "$RUNNER_TEMP/remotion-bin/$tool"; then
              chmod +x "$RUNNER_TEMP/remotion-bin/$tool"
              echo "$RUNNER_TEMP/remotion-bin" >> "$GITHUB_PATH"
            else
              echo "$tool unavailable; do not block on apt downloads" >&2
              exit 1
            fi
          done
        working-directory: remotion
      - name: Generate test audio (captions only)
        if: env.RENDER_TARGET == 'ecosystem-captions' || env.RENDER_TARGET == 'all'
        run: mkdir -p public && ffmpeg -hide_banner -loglevel error -y -f lavfi -i sine=frequency=440:duration=10:sample_rate=16000 -ac 1 public/audio-cue.wav
      - name: Generate reusable original BGM and SFX
        if: env.RENDER_TARGET == 'thunder-music' || env.RENDER_TARGET == 'project' || env.RENDER_TARGET == 'water-cycle' || env.RENDER_TARGET == 'all'
        run: python3 scripts/generate_audio_assets.py
      - name: Render selected composition
        run: |
          set -euo pipefail
          case "$RENDER_TARGET" in
            project) python3 scripts/render_project.py --project "$RENDER_PROJECT" ;;
            water-cycle) python3 scripts/render_project.py --project water-cycle ;;
            thunder-music) npm run render:thunder-music ;;
            ecosystem-transitions) npm run render:ecosystem ;;
            ecosystem-graphics) npm run render:graphics ;;
            ecosystem-captions) npm run render:captions ;;
            all)
              npm run render:ecosystem
              npm run render:graphics
              npm run render:captions
              npm run render:thunder-music
              npm run render:story
              ;;
            *) echo "Invalid target: $RENDER_TARGET" >&2; exit 2 ;;
          esac
      - name: Validate selected outputs
        run: |
          set -euo pipefail
          case "$RENDER_TARGET" in
            project) files=("$RENDER_PROJECT.mp4") ;;
            water-cycle) files=(water-cycle.mp4) ;;
            thunder-music) files=(thunder-music.mp4) ;;
            ecosystem-transitions) files=(ecosystem-transitions.mp4) ;;
            ecosystem-graphics) files=(ecosystem-graphics.mp4) ;;
            ecosystem-captions) files=(ecosystem-captions.mp4) ;;
            all) files=(ecosystem-transitions.mp4 ecosystem-graphics.mp4 ecosystem-captions.mp4 thunder-music.mp4 water-cycle.mp4) ;;
            *) exit 2 ;;
          esac
          for file in "${files[@]}"; do
            test -s "out/$file"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 "out/$file"
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "out/$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: remotion-${{ env.RENDER_TARGET }}-${{ github.run_id }}
          path: remotion/out/*.mp4
          retention-days: 30
          if-no-files-found: error
      - name: Publish run locator
        if: always()
        continue-on-error: true
        env:
          JOB_RESULT: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_REF: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SELECTED_TARGET: ${{ env.RENDER_TARGET }}
          SELECTED_PROJECT: ${{ env.RENDER_PROJECT }}
        working-directory: .
        run: |
          mkdir -p .video-status
          python3 - <<'PY'
          import json,os,datetime
          status={"run_id":int(os.environ["RUN_ID"]),"attempt":int(os.environ["RUN_ATTEMPT"]),"job_status":os.environ["JOB_RESULT"],"sha":os.environ["RUN_SHA"],"branch":os.environ["RUN_REF"],"run_url":f'https://github.com/{os.environ["REPOSITORY"]}/actions/runs/{os.environ["RUN_ID"]}',"updated_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"artifact_name":"remotion-"+os.environ["SELECTED_TARGET"]+"-"+os.environ["RUN_ID"],"selected_target":os.environ["SELECTED_TARGET"],"selected_project":os.environ["SELECTED_PROJECT"],"expected_files":([ "ecosystem-transitions.mp4","ecosystem-graphics.mp4","ecosystem-captions.mp4","thunder-music.mp4","water-cycle.mp4"] if os.environ["SELECTED_TARGET"]=="all" else [(os.environ["SELECTED_PROJECT"] if os.environ["SELECTED_TARGET"]=="project" else os.environ["SELECTED_TARGET"])+".mp4"])}
          with open('.video-status/remotion-latest.json','w') as f: json.dump(status,f,ensure_ascii=False,indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .video-status/remotion-latest.json
          git commit -m "ci: record Remotion render run [skip ci]" || exit 0
          git pull --rebase origin main && git push origin HEAD:main || echo 'Locator update conflicted; video artifact remains valid'
