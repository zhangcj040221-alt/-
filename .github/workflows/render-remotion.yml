name: Render Remotion Experience
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'remotion/**'
      - '.github/workflows/render-remotion.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          fc-match 'Noto Sans CJK SC' | head -1
        working-directory: .
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate test audio
        run: python3 -c 'import wave,math,struct,os; os.makedirs("public",exist_ok=True); w=wave.open("public/audio-cue.wav","wb"); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); w.writeframes(b"".join(struct.pack("<h",int(7000*math.sin(2*math.pi*440*i/16000))) for i in range(160000))); w.close()'
      - name: Render video
        run: |
          npm run render:ecosystem
          npm run render:graphics
          npm run render:captions
      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
        working-directory: .
      - name: Validate video
        run: |
          test -s out/ecosystem-transitions.mp4
          test -s out/ecosystem-graphics.mp4
          test -s out/ecosystem-captions.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 out/ecosystem-captions.mp4
          ffmpeg -hide_banner -i out/ecosystem-captions.mp4 -vn -af volumedetect -f null - 2>&1 | tee /tmp/remotion-audio-levels.txt
          grep -q 'max_volume:' /tmp/remotion-audio-levels.txt
          if grep -q 'max_volume: -91.0 dB' /tmp/remotion-audio-levels.txt; then exit 1; fi
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 out/ecosystem-transitions.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 out/ecosystem-graphics.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 out/ecosystem-captions.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: remotion-ecosystem-validation
          path: |
            remotion/out/ecosystem-transitions.mp4
            remotion/out/ecosystem-graphics.mp4
            remotion/out/ecosystem-captions.mp4
          retention-days: 30
          if-no-files-found: error
      - name: Publish run locator
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          RUN_REF: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        working-directory: .
        run: |
          mkdir -p .video-status
          python3 - <<'PY'
          import json,os,datetime
          status={"run_id":int(os.environ["RUN_ID"]),"attempt":int(os.environ["RUN_ATTEMPT"]),"job_status":os.environ["JOB_RESULT"],"sha":os.environ["RUN_SHA"],"branch":os.environ["RUN_REF"],"run_url":f'https://github.com/{os.environ["REPOSITORY"]}/actions/runs/{os.environ["RUN_ID"]}',"updated_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"artifact_name":"remotion-ecosystem-validation","expected_files":["ecosystem-transitions.mp4","ecosystem-graphics.mp4","ecosystem-captions.mp4"]}
          with open('.video-status/remotion-latest.json','w') as f: json.dump(status,f,ensure_ascii=False,indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .video-status/remotion-latest.json
          git commit -m "ci: record Remotion render run [skip ci]" || exit 0
          git push origin HEAD:main
