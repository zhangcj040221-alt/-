name: Render Revideo Demo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-revideo.yml'
permissions:
  contents: write
concurrency:
  group: revideo-demo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DISABLE_TELEMETRY: 'true'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
      - name: Install dependencies and establish reproducible lockfile
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock Revideo dependency tree"
            git push origin HEAD:main
          fi
      - name: Verify dependencies
        run: npm ls --depth=0
      - name: Install matching Chrome Headless Shell
        run: npx --no-install puppeteer browsers install chrome-headless-shell
      - name: Render 5-second MP4 headlessly
        run: npm run render
      - name: Validate MP4
        run: |
          test -s out/hello-revideo.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 out/hello-revideo.mp4 | tee out/video-metadata.txt
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 out/hello-revideo.mp4 | tee -a out/video-metadata.txt
          grep -qx 'width=1920' out/video-metadata.txt
          grep -qx 'height=1080' out/video-metadata.txt
          grep -qx 'r_frame_rate=30/1' out/video-metadata.txt
          python3 -c "import subprocess; p='out/hello-revideo.mp4'; d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',p])); assert 4.8 <= d <= 5.2, d"

          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 out/hello-revideo.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,nb_frames -of default=noprint_wrappers=1 out/hello-revideo.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: revideo-demo-mp4
          path: out/hello-revideo.mp4
          retention-days: 30
          if-no-files-found: error
