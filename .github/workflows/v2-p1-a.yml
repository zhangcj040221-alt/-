name: V2 P1 Experiment A - Remotion
on:
  push:
    branches: [v2-p1-experiments]
    paths:
      - 'v2/p1/experiment-a/remotion/**'
      - '.github/workflows/v2-p1-a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2/p1/experiment-a/remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Verify composition
        run: npm run compositions
      - name: Render actual video
        run: npm run render
      - name: Probe output
        run: |
          ls -lh out/particle-path.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=width,height,avg_frame_rate -of json out/particle-path.mp4
      - name: Upload video for visual review
        uses: actions/upload-artifact@v4
        with:
          name: v2-p1-a-remotion
          path: v2/p1/experiment-a/remotion/out/particle-path.mp4
          if-no-files-found: error
