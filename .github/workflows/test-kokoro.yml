name: Test Kokoro Chinese TTS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'remotion/scripts/test_kokoro.py'
      - '.github/workflows/test-kokoro.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mature TTS packages
        run: |
          python -m pip install kokoro-onnx misaki[zh] soundfile huggingface_hub
      - name: Download official model files
        run: |
          mkdir -p models
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          from urllib.request import urlretrieve
          base = "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/"
          for name in ["kokoro-v1.1-zh.int8.onnx", "voices-v1.1-zh.bin"]:
              urlretrieve(base + name, "models/" + name)
          hf_hub_download(repo_id="hexgrad/Kokoro-82M-v1.1-zh", filename="config.json", local_dir="models")
          PY
      - name: Synthesize Mandarin
        run: python scripts/test_kokoro.py
      - name: Verify audible audio without apt or FFmpeg
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import soundfile as sf
          import numpy as np
          folder = Path("out/kokoro-test")
          items = json.loads((folder / "report.json").read_text(encoding="utf-8"))
          assert len(items) == 2, "Expected two Mandarin samples"
          for item in items:
              data, rate = sf.read(folder / item["file"])
              duration = len(data) / rate
              peak = float(np.max(np.abs(data)))
              print(item["file"], "duration", round(duration, 2), "peak", round(peak, 3), flush=True)
              assert duration > 0.5 and peak > 0.005, "Empty or silent WAV"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kokoro-chinese-tts-smoke-test
          path: |
            remotion/out/kokoro-test/
          retention-days: 14
